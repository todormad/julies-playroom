<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Astro Buddy: The Water Planet | Astro Juli</title>
<meta name="description" content="The starship crashes on a water planet. Swim the ocean, repair the ship on the island, then fly through old missile defenses. Play free in your browser.">
<link rel="canonical" href="https://astrojuli.com/games/water-planet/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0a2744">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1a28;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;font-family:'Segoe UI',sans-serif;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));gap:12px}
.hub-back{display:inline-flex;align-items:center;align-self:flex-start;font:700 .88rem 'Segoe UI',sans-serif;color:#7af0ff;text-decoration:none;padding:8px 14px;border:1px solid #2a4a5a;border-radius:999px;background:#123040;box-shadow:0 2px 10px #0006}
.hub-back:hover{color:#c8ffff;border-color:#00c8e0}
#wrap{position:relative;width:min(700px,100%)}
canvas{display:block;width:100%;height:auto;border-radius:10px;box-shadow:0 0 40px #000a;touch-action:manipulation}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#touchControls{display:none;width:min(700px,100%);justify-content:space-between;align-items:center;gap:12px;padding:2px 8px max(2px,env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none}
@media (pointer:coarse){#touchControls{display:flex}}
#dpad{position:relative;width:150px;height:150px;border-radius:50%;background:#1a2430;border:2px solid #2a3a4a;box-shadow:0 4px 16px #0008;touch-action:none;flex-shrink:0}
.dp-arrow{position:absolute;color:#4a6a8a;font-size:18px;line-height:1;pointer-events:none}
.dp-up{top:10px;left:50%;transform:translateX(-50%)}
.dp-down{bottom:10px;left:50%;transform:translateY(0);left:50%;transform:translateX(-50%)}
.dp-left{left:10px;top:50%;transform:translateY(-50%)}
.dp-right{right:10px;top:50%;transform:translateY(-50%)}
#dpadNub{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#2e4256;border:2px solid #3d5a75;pointer-events:none}
#actionBtns{display:flex;align-items:center;gap:10px;flex-shrink:0}
#robotBtn{width:64px;height:64px;border-radius:50%;border:2px solid #69f0ae;background:#0b3a2a;color:#b9f6ca;font:800 22px 'Segoe UI',sans-serif;box-shadow:0 4px 16px #0008;touch-action:none;user-select:none;cursor:pointer}
#robotBtn:active{transform:scale(.94)}
#robotBtn[hidden]{display:none}
#robotBtn:disabled{opacity:.35}
#bowBtn{width:76px;height:76px;border-radius:50%;border:2px solid #26c6da;background:#0b3a4a;color:#80deea;font:800 28px 'Segoe UI',sans-serif;box-shadow:0 4px 16px #0008;touch-action:none;user-select:none;cursor:pointer}
#bowBtn:active{transform:scale(.94)}
#bowBtn[hidden]{display:none}
#actionBtn{width:96px;height:96px;border-radius:50%;border:2px solid #00a8cc;background:#0b3a4a;color:#7af0ff;font:800 34px 'Segoe UI',sans-serif;box-shadow:0 4px 16px #0008;touch-action:none;user-select:none;cursor:pointer}
#actionBtn:active{transform:scale(.94);background:#0e4a5e}
</style>
</head>
<body>
<a href="/" class="hub-back">← All games</a>
<div id="wrap">
  <canvas id="c" width="700" height="520"></canvas>
  <div id="ui"></div>
</div>
<div id="touchControls">
  <div id="dpad">
    <span class="dp-arrow dp-up">▲</span>
    <span class="dp-arrow dp-down">▼</span>
    <span class="dp-arrow dp-left">◀</span>
    <span class="dp-arrow dp-right">▶</span>
    <span id="dpadNub"></span>
  </div>
  <div id="actionBtns">
    <button id="robotBtn" type="button" aria-label="Robot">R</button>
    <button id="bowBtn" type="button" aria-label="Bow">B</button>
    <button id="actionBtn" type="button" aria-label="Action">A</button>
  </div>
</div>
<script type="module" src="js/main.js?v=5"></script>
</body>
</html>
